<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고교 진로 로드맵 AI 컨설턴트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.8rem;
      color: #2c3e50;
      margin-bottom: 8px;
      text-align: center;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }
    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #4a90e2;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #357abd;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #result-container {
      margin-top: 30px;
      padding: 20px;
      background-color: #f9fbfd;
      border: 1px solid #e1e8ed;
      border-radius: 8px;
      display: none;
      white-space: pre-line;
    }
    .loading {
      text-align: center;
      color: #666;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎓 고교 진로/학업 로드맵 AI</h1>
    <p class="subtitle">진로 목표와 질문을 남기시면 맞춤형 로드맵과 답변을 드립니다.</p>

    <form id="roadmap-form">
      <div class="form-group">
        <label for="grade">학년</label>
        <select id="grade" required>
          <option value="">학년을 선택하세요</option>
          <option value="고등학교 1학년">고등학교 1학년</option>
          <option value="고등학교 2학년">고등학교 2학년</option>
          <option value="고등학교 3학년">고등학교 3학년</option>
          <option value="예비 고등학생">예비 고등학생</option>
        </select>
      </div>

      <div class="form-group">
        <label for="target">희망 진로 / 목표 학과</label>
        <input type="text" id="target" placeholder="예: 컴퓨터공학과, 의예과, 미디어커뮤니케이션학과" required>
      </div>

      <div class="form-group">
        <label for="interest">관심 분야 / 좋아하는 과목</label>
        <input type="text" id="interest" placeholder="예: 인공지능, 생명과학, 수학 탐구 활동">
      </div>

      <div class="form-group">
        <label for="question">🙋‍♂️ 자유 질문 및 의견 (마지막 칸)</label>
        <textarea id="question" placeholder="궁금한 점이나 고민, 의견을 입력해 주세요. (예: 생기부 활동 주제 추천받고 싶어요, 수학 성적 올리는 방법이 궁금해요 등)"></textarea>
      </div>

      <button type="submit" id="submit-btn">로드맵 & 답변 받기</button>
    </form>

    <div class="loading" id="loading">🤖 Gemini AI가 답변을 작성 중입니다...</div>
    <div id="result-container"></div>
  </div>

  <script>
    const form = document.getElementById('roadmap-form');
    const submitBtn = document.getElementById('submit-btn');
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('result-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const grade = document.getElementById('grade').value;
      const target = document.getElementById('target').value;
      const interest = document.getElementById('interest').value;
      const question = document.getElementById('question').value;

      submitBtn.disabled = true;
      loading.style.display = 'block';
      resultContainer.style.display = 'none';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ grade, target, interest, question })
        });

        const data = await response.json();

        if (response.ok) {
          resultContainer.textContent = data.result;
          resultContainer.style.display = 'block';
        } else {
          alert(data.error || '오류가 발생했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버와 통신 중 오류가 발생했습니다.');
      } finally {
        submitBtn.disabled = false;
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
