<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Q&A Assistant</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      resize: vertical;
      margin-bottom: 12px;
    }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0051a2;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .response-area {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .response-box {
      background: #f1f3f5;
      padding: 16px;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.6;
      min-height: 80px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Gemini에게 질문하기</h1>
    <textarea id="questionInput" placeholder="질문할 내용을 입력해 주세요..."></textarea>
    <button id="submitBtn" onclick="askQuestion()">질문하기</button>

    <div class="response-area">
      <h3>답변</h3>
      <div id="responseBox" class="response-box">질문을 입력하고 버튼을 눌러주세요.</div>
    </div>
  </div>

  <script>
    async function askQuestion() {
      const questionInput = document.getElementById('questionInput');
      const responseBox = document.getElementById('responseBox');
      const submitBtn = document.getElementById('submitBtn');

      const question = questionInput.value.trim();
      if (!question) {
        alert('질문을 입력해주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '답변 생성 중...';
      responseBox.innerText = '답변을 생각하는 중입니다...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ question }),
        });

        const data = await res.json();

        if (res.ok) {
          responseBox.innerText = data.answer;
        } else {
          responseBox.innerText = `오류 발생: ${data.error || '답변을 가져오지 못했습니다.'}`;
        }
      } catch (err) {
        console.error(err);
        responseBox.innerText = '서버 통신 중 오류가 발생했습니다.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '질문하기';
      }
    }
  </script>
</body>
</html>
